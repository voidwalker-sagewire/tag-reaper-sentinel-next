name: Build Tag Reaper Sentinel APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.7"

      - name: Check recovered R1 repair logic
        shell: bash
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          javac -d "$check_dir" \
            field-repair/tests/Handler.java \
            field-repair/tests/SellEtonFrameParser.java \
            field-repair/tests/StableWeightLatch.java \
            field-repair/src/com/herdmate/tagreapersentinel/LiveRefreshGate.java \
            field-repair/tests/RepairChecks.java
          java -cp "$check_dir" com.herdmate.tagreapersentinel.RepairChecks

      - name: Test and build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tag-reaper-sentinel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
